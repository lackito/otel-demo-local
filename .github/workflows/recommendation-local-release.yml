name: Release Recommendation to local Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - config/recommendation-source-ref
  workflow_dispatch:

concurrency:
  group: recommendation-local-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  APPS_REPOSITORY: lackito/otel-demo-apps
  IMAGE_NAME: otel-demo-local-recommendation
  REGISTRY: ghcr.io
  VALUES_FILE: gitops/otel-demo/values.yaml

jobs:
  release:
    name: Build, publish, and update local desired state
    runs-on: ubuntu-latest

    steps:
      - name: Check out local platform repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Test the values updater
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Read selected application revision
        id: source
        shell: bash
        run: |
          source_ref="$(tr -d '[:space:]' < config/recommendation-source-ref)"
          if [[ ! "${source_ref}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "config/recommendation-source-ref must contain one full lowercase Git SHA." >&2
            exit 1
          fi
          echo "ref=${source_ref}" >> "$GITHUB_OUTPUT"

      - name: Check out selected application source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APPS_REPOSITORY }}
          ref: ${{ steps.source.outputs.ref }}
          path: application-source
          persist-credentials: false

      - name: Verify selected application revision
        env:
          EXPECTED_REF: ${{ steps.source.outputs.ref }}
        run: |
          actual_ref="$(git -C application-source rev-parse HEAD)"
          if [[ "${actual_ref}" != "${EXPECTED_REF}" ]]; then
            echo "Checked out ${actual_ref}; expected ${EXPECTED_REF}." >&2
            exit 1
          fi

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          image_repository="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "repository=${image_repository}"
            echo "tag=${SOURCE_REF}"
            echo "uri=${image_repository}:${SOURCE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish arm64 image
        uses: docker/build-push-action@v7
        with:
          context: application-source/apps/recommendation
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.ref }}
          cache-from: type=gha,scope=recommendation-local
          cache-to: type=gha,mode=max,scope=recommendation-local

      - name: Verify anonymous image access
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          image_path="${IMAGE_REPOSITORY#ghcr.io/}"
          token="$(
            curl \
              --fail \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --silent \
              --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_path}:pull" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${token}" \
            --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${image_path}/manifests/${IMAGE_TAG}" \
            >/dev/null || {
              echo "The image was published but is not anonymously pullable." >&2
              echo "Make the GHCR package public, then rerun this workflow." >&2
              exit 1
            }

      - name: Update local desired image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          python3 .github/scripts/update_recommendation_values.py \
            --file "${VALUES_FILE}" \
            --repository "${IMAGE_REPOSITORY}" \
            --tag "${IMAGE_TAG}"
          git diff --check
          git diff -- "${VALUES_FILE}"

      - name: Commit and push local desired state
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if git diff --quiet -- "${VALUES_FILE}"; then
            echo "Local desired state already references ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"
          git commit -m "chore(recommendation): deploy ${IMAGE_TAG}"
          git push origin HEAD:main
